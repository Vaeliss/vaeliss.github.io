hugoblox:
  schema: "2.0"

  identity:
    name: "Alvise Dei Rossi"
    organization: ""
    type: person
    tagline: "Robust machine learning for physiological data"
    description: "Personal website of Alvise Dei Rossi, PhD candidate working on robust machine learning for physiological time series, sleep, wearables, and health AI."
    social:
      twitter: ""

  theme:
    mode: system
    pack: "default"
    colors:
      primary: "teal"
      secondary: "slate"
      neutral: "zinc"
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  typography:
    pack: "academic"

  layout:
    radius: "sm"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: false
    text: "Source repository is private. Rendered site may be public through GitHub Pages."

  copyright:
    notice: "Copyright {year} {name}."
    license:
      type: custom
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

  seo:
    title: "Alvise Dei Rossi"
    location:
      address:
        street: ""
        city: ""
        region: ""
        postal_code: ""
        country: ""
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Public professional profile for job applications and research visibility."
      contact: "alvise.deirossi@gmail.com"

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: apa

  search:
    enable: false
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  repository:
    enable: false
    url: "https://github.com/Vaeliss/job_applications_website"
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "15:04"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false
    hud:
      position: bottom-left
      opacity: 1.0
    export_logs: true

  pro:
    hide_attribution: false
    affiliate_code: ""
